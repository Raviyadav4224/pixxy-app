# =========================
# General
# =========================
server.port=${SPRING_APP_PORT:8081}

# =========================
# Feign
# =========================
fileservice.url=${FILESERVICE_URL}

# =========================
# MySQL
# =========================
spring.datasource.url=jdbc:mysql://${MYSQL_HOSTNAME}:${MYSQL_PORT_HOST}/${MYSQL_DB_NAME}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_USER_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.expirationMillis=${JWT_EXPIRATION_MS}

# =========================
# Logging
# =========================
logging.level.com.url=${LOG_LEVEL:DEBUG}
logging.file.name=${LOG_PATH}/${SPRING_APP_NAME}.log

# =========================
# Tracing (optional)
# =========================
otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:}

# =========================
# Feign / Resilience
# =========================
feign.client.config.FILESERVICE.connect-timeout=${FEIGN_CONNECT_TIMEOUT:500}
feign.client.config.FILESERVICE.read-timeout=${FEIGN_READ_TIMEOUT:500}

resilience4j.timelimiter.instances.fileService.timeout-duration=${FILE_TIMEOUT:3s}