# =========================
# General
# =========================
server.port=${SPRING_APP_PORT:8082}

spring.application.name=pixxy-api-gateway

# =========================
# MySQL Database
# =========================
spring.datasource.url=jdbc:mysql://${MYSQL_HOSTNAME:localhost}:${MYSQL_PORT_HOST:3307}/${MYSQL_DB_NAME}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_USER_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.expirationMillis=${JWT_EXPIRATION_MILLIS:86400000}
jwt.security.enabled=${JWT_SECURITY_ENABLED:true}

# =========================
# Logging
# =========================
logging.level.com.url=DEBUG

# (In container avoid C:/logs ? use container path)
logging.file.name=/logs/${spring.application.name}.log

logging.logback.rollingpolicy.file-name-pattern=/logs/${spring.application.name}-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level traceId=%X{traceId} spanId=%X{spanId} %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level traceId=%X{traceId} spanId=%X{spanId} %logger{36} - %msg%n

# =========================
# File Upload
# =========================
file.storage.type=${FILE_STORAGE_TYPE:LOCAL}

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:20MB}

# =========================
# Actuator & Tracing
# =========================
management.endpoints.web.exposure.include=health,info
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false

# =========================
# (Optional) Eureka
# =========================
#eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}