apiVersion: v1
kind: ConfigMap
metadata:
  name: pixxy-file-service-configmap
  namespace: pixxy
data:
  SPRING_APP_PORT: "8082"

  MYSQL_HOSTNAME: "mysql"
  MYSQL_PORT_HOST: "3306"
  MYSQL_DB_NAME: practice

  JWT_EXPIRATION_MILLIS: "86400000"
  JWT_SECURITY_ENABLED: "true"

  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4317"

  FILE_STORAGE_TYPE: "LOCAL"
  SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "20MB"
  SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "20MB"
